[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethiviz"
version = "0.12.0"
description = "Cross-cultural AI bias detection through seven ethical lenses with AIF360-parity fairness metrics and mitigation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["bias", "fairness", "ai-ethics", "cross-cultural", "ubuntu", "confucian",
            "islamic", "weat", "intersectional", "decolonize-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.4",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Flask/flask-cors were previously installed ad hoc by start_ethiviz.sh,
# invisible to pip-audit or any other dependency scanner since nothing in
# this file declared them (Upgrade 44). flask-limiter (Upgrade 41) and
# filetype (Upgrade 43) are new Phase 1 additions to Scripts/api_server.py.
api = [
    # Floors below are deliberately higher than "whatever works" — pip-audit
    # (Upgrade 44's CI job) found known CVEs in the versions pip resolves to
    # under looser floors (flask 3.0.3, flask-cors 5.0.1, werkzeug 3.0.3, all
    # pulled in transitively by flask): PYSEC-2026-2151, -1383/-1384/-1385,
    # and five werkzeug advisories respectively. Verified clean with
    # `pip-audit` against these floors on 2026-08-19.
    "flask>=3.1.3",
    "flask-cors>=6.0.0",
    "werkzeug>=3.1.6",
    "flask-limiter>=3.5",
    "filetype>=1.2",
]
# Optional production backends for Scripts/analysis_queue.py (Upgrade 46)
# and ethiviz/storage/job_store.py (Upgrade 48). Neither is required for the
# zero-config dev path: without ETHIVIZ_REDIS_URL, analyze jobs run on an
# in-process ThreadPoolExecutor; without DATABASE_URL, JobStore stays SQLite.
queue = ["redis>=5.0", "rq>=1.16"]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
semantic = ["sentence-transformers>=2.2"]
vision = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "transformers>=4.35",
    "torch>=2.0",
]
explainability = ["lime>=0.2", "shap>=0.44"]
multilingual = ["langdetect>=1.0", "jieba>=0.42", "stanza>=1.7"]
calibration = []                            # uses scikit-learn from core deps
batch = ["tqdm>=4.65"]
aif360 = ["aif360>=0.6"]
fairlearn = ["fairlearn>=0.9"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
    "black>=23.7",
    "ruff>=0.1",
    "mypy>=1.5",
]
full = [
    "ethiviz[semantic,vision,explainability,multilingual,batch,aif360,fairlearn,api,queue,postgres]"
]

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout auto-discovery sees both `ethiviz/`
# and the dead, non-buildable `project/` directory (an orphaned React
# frontend stub, superseded by the working ../project/) as top-level
# packages and refuses to build entirely. Scoping discovery to `ethiviz*`
# fixes `pip install -e .` without needing to touch/remove `project/`.
include = ["ethiviz*"]

[tool.pytest.ini_options]
addopts = "-p no:langsmith"
testpaths = ["tests"]
