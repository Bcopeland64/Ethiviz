name: EthiViz V9.5 CI

on:
  push:
    branches: [main, master]
    paths:
      - "Ethiviz_V9.5/**"
      - ".github/workflows/ethiviz-v9.5-ci.yml"
  pull_request:
    paths:
      - "Ethiviz_V9.5/**"
      - ".github/workflows/ethiviz-v9.5-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ethiviz_V9.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Ethiviz_V9.5/pyproject.toml
      - name: Install backend and evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev,evaluation]"
      - name: Run backend and evaluator tests
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ethiviz_V9.5/project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Ethiviz_V9.5/project/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --runInBand
      - name: Build and enforce initial bundle budget
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
