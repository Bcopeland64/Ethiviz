name: EthiViz V9 CI

on:
  push:
    branches: [main, master]
    paths:
      - "Ethiviz_V9/**"
      - ".github/workflows/ethiviz-v9-ci.yml"
  pull_request:
    paths:
      - "Ethiviz_V9/**"
      - ".github/workflows/ethiviz-v9-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ethiviz_V9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Ethiviz_V9/pyproject.toml
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"
      - name: Run backend tests
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ethiviz_V9/project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Ethiviz_V9/project/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --runInBand
      - name: Build and enforce initial bundle budget
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Record full dependency audit
        id: full-audit
        continue-on-error: true
        run: npm audit --json > npm-audit-full.json
      - name: Summarize production and development advisories
        if: always()
        run: node scripts/summarize-npm-audit.mjs npm-audit-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: Ethiviz_V9/project/npm-audit-full.json
          if-no-files-found: ignore
