# nginx config for the `frontend` service in docker-compose.yml — serves the
# built React app as static files and reverse-proxies /api and /metrics to
# the `api` service by its Compose service name. This is a different file
# from nginx.conf.sample (Upgrade 42's bare-metal/VM TLS-terminating
# example): Compose deployments typically put TLS termination at a cloud
# load balancer or an outer reverse proxy in front of this container, so
# this file stays plain HTTP on port 80 rather than duplicating the
# certificate-path instructions nginx.conf.sample already covers.

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:5001; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Matches Scripts/api_server.py's own MAX_CONTENT_LENGTH (50MB) — this
    # must be at least as large or nginx rejects legitimate uploads before
    # Flask ever sees them.
    client_max_body_size 50m;

    # nginx resolves a bare hostname in proxy_pass exactly once, at config
    # load — reproduced directly: recreating the `api` container (e.g.
    # `docker compose up -d api` after a rebuild, or any rolling restart)
    # gives it a new IP on the Compose network, and this container kept
    # proxying to the old one until nginx itself was also restarted, 502ing
    # every /api/ and /metrics request in between. Docker's embedded DNS at
    # 127.0.0.11 plus a variable in proxy_pass forces nginx to re-resolve
    # `api` (respecting the `valid` TTL below) instead of caching it
    # forever — variables are evaluated per-request, not at config load.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream api:5001;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        set $api_upstream api:5001;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
